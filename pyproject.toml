[project]
name = "lablens"
version = "0.1.0"
description = "Medication-aware lab triage agent for the Agents Assemble Healthcare AI Hackathon"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Sebastian Tsang" },
    { name = "Paarth K" },
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "mcp>=1.9.0",
    "httpx>=0.28.0",
    "pyjwt>=2.10.0",
    "pydantic>=2.9.0",
    "anthropic>=0.40.0",
    "google-generativeai>=0.8.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "pyright>=1.1.380",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lablens"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
